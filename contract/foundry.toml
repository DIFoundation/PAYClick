[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
botchain_testnet = "https://rpc.bohr.life"
botchain_mainnet = "https://rpc.botchain.ai"

# BOTScan verification (check https://scan.botchain.ai for API key support)
[etherscan]
botchain_testnet = { key = "${BOTSCAN_API_KEY}", url = "https://scan.bohr.life/api" }
botchain_mainnet = { key = "${BOTSCAN_API_KEY}", url = "https://scan.botchain.ai/api" }